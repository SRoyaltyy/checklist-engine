name: nai-auto2
on: [push, workflow_dispatch]
jobs: {auto: {runs-on: ubuntu-latest, timeout-minutes: 10, permissions: {contents: read, actions: read, issues: write}, env: {GH_TOKEN: '${{ github.token }}'}, steps: [{uses: 'actions/checkout@v4'}, {run: 'o=$(python3 scripts/nai/report2.py 2>&1); r=$?; printf "%s\n" "$o"; [ $r -eq 0 ] && exit 0; printf "::error::rc=%s %s\n" $r "$(printf "%s" "$o" | tail -c 500)"'}]}}
