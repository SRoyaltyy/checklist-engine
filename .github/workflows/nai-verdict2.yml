name: nai-verdict2
on: [push, workflow_dispatch]
jobs: {collect: {runs-on: ubuntu-latest, timeout-minutes: 10, permissions: {contents: write, actions: read}, env: {GH_TOKEN: '${{ github.token }}', RID: '${{ inputs.run_id || ''41413529249'' }}', API: 'https://api.github.com/repos/${{ github.repository }}'}, steps: [{uses: actions/checkout@v4}, {run: 'mkdir -p agent && curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/actions/runs/$RID" -o /tmp/run.json && curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/actions/runs/$RID/jobs" -o /tmp/jobs.json && curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$API/actions/runs/$RID/logs" -o /tmp/logs.zip'}, {run: 'unzip -p /tmp/logs.zip "*.txt" 2>/dev/null | tail -c 4096 > /tmp/tail.txt || true'}, {run: 'jq -n --slurpfile run /tmp/run.json --slurpfile jobs /tmp/jobs.json --rawfile tail /tmp/tail.txt --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" ''{collected_at:$at, run:{id:$run[0].id, name:$run[0].name, branch:$run[0].head_branch, sha:$run[0].head_sha, conclusion:$run[0].conclusion, html_url:$run[0].html_url}, jobs:[$jobs[0].jobs[]|{name:.name, conclusion:.conclusion, failed_steps:[.steps[]|select(.conclusion=="failure")|.name]}], log_tail:$tail}'' > agent/RESULT2.json'}, {run: 'git config user.name nai-verdict && git config user.email nai-verdict@users.noreply.github.com && git add agent/RESULT2.json && (git diff --cached --quiet || git commit -m "verdict2: run $RID") && git push'}]}}
