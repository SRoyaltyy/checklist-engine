name: world-full-price-bridge-audit
on:
  push:
    branches: [codex/world-universe-v3]
    paths: ['ci/world_price_bridge_audit.py', '.github/workflows/world_price_bridge_audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKLIST_DATA_DIR: ${{ github.workspace }}/frozen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Verify immutable frozen prices and audit every source archive
        run: |
          mkdir -p frozen
          gh release download data-2020-24-v1 -p universe_2020_survivors_le2024.parquet -p bars_all_le2024.parquet -p SHA256SUMS -D frozen
          cd frozen
          grep -E 'universe_2020_survivors_le2024.parquet|bars_all_le2024.parquet' SHA256SUMS | sha256sum -c -
          cd ..
          python -m ci.world_price_bridge_audit --source-tag world-prices-v3-40259691137-1 --out bridge-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-universe-price-bridge-audit
          path: bridge-audit/
