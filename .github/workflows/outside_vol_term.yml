name: codex-tier1-cboe-term-measurement
on:
  push:
    branches: [codex/tier1-vix-data]
    paths: ['ci/VOLATILITY_TERM_REQUEST.json']
permissions:
  contents: write
concurrency:
  group: volatility-term-released-measurement
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_volatility.py tests/test_volatility_term_released.py tests/test_outside_vol.py tests/test_light_box_vol.py tests/test_world_context_native.py tests/test_world_context_store.py tests/test_market_storage.py -q
      - run: python -m ci.volatility_term_released --directory volatility-term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volatility-term-released-evidence
          path: volatility-term/
          if-no-files-found: ignore
