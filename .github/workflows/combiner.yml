# Combiner (combining model) fit - one matrix job per model target so the two fits run in
# parallel on free runners (a single job fitting both would need ~5.4h > the 360-min cap;
# measured 2.7 min/iter at 400k trades x 15k questions). Gates on ALL Step A answers chunks +
# grid precompute; publishes model_<target>.npz + model.json to MODEL_RELEASE. The second
# target to finish dispatches combiner_predict.
name: combiner
on:
  workflow_dispatch:
  # schedule disabled 2026-10-25 (~13:2x HKT, per §0b audit ceb1b89 fix 7): the hourly cron
  # re-dispatched the fit with Step A complete but no shortlist.csv yet, and runs were being
  # killed/cancelled. Re-enable (cron '53 * * * *') only after shortlist.csv lands on
  # grid-2020-22-v1 and the phase map allows the combiner.
  # schedule:
  #   - cron: '53 * * * *'
concurrency:
  group: combiner-fit
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
env:
  RELEASE: data-2020-24-v1
  GRID_RELEASE: grid-2020-22-v1
  MODEL_RELEASE: combine-2020-22-v1
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [logistic, ridge]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi/exit-grid
      - name: Python + deps (no TA-Lib; the combiner only reads npz/parquet)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q pandas numpy pyarrow
      - name: Download data release + verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/fetch_release.sh "$RELEASE" "$RUNNER_TEMP/data"
      - name: Fit combining model (${{ matrix.target }}) when all inputs are ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: bash ci/combine_run.sh
