# Combiner (combining model) runner job - fits the world-state model once ALL Step A answers
# chunks exist, publishes model artifacts to release combine-2020-22-v1 (METHODOLOGY 0b:
# "write and test the combining model code now, so probabilities come out the moment the
# answers finish"). Hourly schedule re-checks the gate; every gate exit is a clean no-op.
name: combiner
on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
permissions:
  contents: write
env:
  RELEASE: data-2020-24-v1
  GRID_RELEASE: grid-2020-22-v1
  MODEL_RELEASE: combine-2020-22-v1
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi/exit-grid
      - name: Python + deps (no TA-Lib; the combiner only reads npz/parquet)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q pandas numpy pyarrow
      - name: Download data release + verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/fetch_release.sh "$RELEASE" "$RUNNER_TEMP/data"
      - name: Fit combining model when all inputs are ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/combine_run.sh
