name: world-v2-data-validation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Import every gate before heavy jobs
        run: python -m ci.world_pipeline run --state .import-state.json --stage imports -- python -m ci.world_pipeline imports
      - run: python -m pytest tests/test_world_v2.py tests/test_question_quality.py tests/test_price_reconcile.py tests/test_world_infrastructure.py -q
  supplemental-prices:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Fetch 2025-2026 and indicator warmup history independently
        run: python -m fetch.fetch_world_prices --tickers AAPL,MSFT,NVDA,GE,ARQT,BLZE,SPY,QQQ,IWM,XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY --shards 1 --out supplemental-prices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplemental-prices-v2
          path: supplemental-prices/
  fred:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Fetch every ALFRED vintage with pagination
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p fred-source
          python -m fetch.fetch_fred --out fred-source/fred_wide_2020_26.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fred-v2-source
          path: fred-source/
  companyfacts:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PRIMARY_ACTION_RELAY_URL: ${{ secrets.PRIMARY_ACTION_RELAY_URL }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Filing-version fetch on real companies
        run: |
          python -c "import pandas as pd; pd.DataFrame({'ticker':['AAPL','MSFT','GE']}).to_parquet('smoke_universe.parquet',index=False)"
          gh release download data-2020-24-v1 -p sec_shares_out_filed_le_2024.parquet -p SHA256SUMS
          grep sec_shares_out_filed_le_2024.parquet SHA256SUMS | sha256sum -c -
          python -m fetch.fetch_xbrl --universe smoke_universe.parquet --shards 1 --out xbrl-smoke --resume --cik-map-file sec_shares_out_filed_le_2024.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbrl-v2-source
          path: xbrl-smoke/
  smoke:
    needs: [verify, companyfacts, supplemental-prices, fred]
    if: ${{ always() && needs.verify.result == 'success' && needs.supplemental-prices.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHECKLIST_DATA_DIR: ${{ github.workspace }}/world_in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Fetch frozen and external inputs
        run: python -m ci.world_pipeline run --state world-smoke/PIPELINE_STAGES.json --stage inputs -- bash ci/world_fetch.sh "$CHECKLIST_DATA_DIR"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: xbrl-v2-source
          path: ${{ github.workspace }}/world_in/data-ext
      - uses: actions/download-artifact@v4
        with:
          name: supplemental-prices-v2
          path: ${{ github.workspace }}/world_in/supplemental-prices
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fred-v2-source
          path: ${{ github.workspace }}/world_in/data-ext
      - name: Build real multi-timeframe smoke snapshot
        id: build
        if: always()
        run: python -m ci.world_pipeline run --state world-smoke/PIPELINE_STAGES.json --stage build --requires inputs -- python world_snapshot_v2.py --out world-smoke --shards 1 --tickers AAPL,MSFT,NVDA,GE,ARQT,BLZE --supplemental-prices "$CHECKLIST_DATA_DIR/supplemental-prices"
      - name: Rebuild every column with future inputs removed
        id: leak
        if: always()
        run: python -m ci.world_pipeline run --state world-smoke/PIPELINE_STAGES.json --stage leak --requires build -- python -m ci.world_v2_leak --tickers AAPL,MSFT,NVDA,GE,ARQT,BLZE --out world-smoke/WORLD_LEAK.json --supplemental-prices "$CHECKLIST_DATA_DIR/supplemental-prices"
      - name: Measured coverage gate (fail closed)
        id: coverage
        if: always()
        run: python -m ci.world_pipeline run --state world-smoke/PIPELINE_STAGES.json --stage coverage --requires build -- python -m ci.world_v2_coverage --shards world-smoke/world_shard_*_part_*.parquet --out world-smoke --gate --source-root "$CHECKLIST_DATA_DIR/data-ext"
      - name: Explain upstream and downstream outcomes
        if: always()
        env:
          SOURCE_PRICES: ${{ needs.supplemental-prices.result }}
          SOURCE_XBRL: ${{ needs.companyfacts.result }}
          SOURCE_FRED: ${{ needs.fred.result }}
          BUILD: ${{ steps.build.outcome }}
          LEAK: ${{ steps.leak.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          mkdir -p world-smoke
          python -c "import os,json; from pathlib import Path; p={k:os.getenv(k) for k in ('SOURCE_PRICES','SOURCE_XBRL','SOURCE_FRED','BUILD','LEAK','COVERAGE')}; print(json.dumps(p)); Path('world-smoke/PIPELINE_STATUS.json').write_text(json.dumps(p,indent=2))"
      - name: Preserve evidence even when a gate fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-v2-evidence
          path: |
            world-smoke/*.parquet
            world-smoke/*.json
            world-smoke/*.csv
      - name: Publish separate immutable provisional smoke release
        if: always()
        run: python -m ci.world_pipeline run --state world-smoke/PIPELINE_STAGES.json --stage publish --requires build leak -- python -m ci.world_pipeline publish --directory world-smoke --tag "world-smoke-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --source-commit "$GITHUB_SHA"
