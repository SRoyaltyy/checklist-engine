name: world-v2-prerequisites
on:
  push:
    branches: [codex/world-state-v2]
    paths:
      - 'facets_world.py'
      - 'world_*.py'
      - 'fetch/fetch_xbrl.py'
      - 'ci/world_v2_*.py'
      - 'ci/question_quality.py'
      - 'tests/test_question_quality.py'
      - 'docs/QUESTION_TREE_v3.md'
      - 'ci/world_fetch.sh'
      - 'tests/test_world_v2.py'
      - 'requirements-world-v2.txt'
      - '.github/workflows/world_v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_v2.py tests/test_question_quality.py -q
  companyfacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Filing-version fetch on real companies
        run: |
          python -c "import pandas as pd; pd.DataFrame({'ticker':['AAPL','MSFT','GE']}).to_parquet('smoke_universe.parquet',index=False)"
          gh release download data-2020-24-v1 -p sec_shares_out_filed_le_2024.parquet -p SHA256SUMS
          grep sec_shares_out_filed_le_2024.parquet SHA256SUMS | sha256sum -c -
          python fetch/fetch_xbrl.py --universe smoke_universe.parquet --shards 1 --out xbrl-smoke --resume --cik-map-file sec_shares_out_filed_le_2024.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbrl-v2-source
          path: xbrl-smoke/
  smoke:
    needs: [verify, companyfacts]
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHECKLIST_DATA_DIR: ${{ github.workspace }}/world_in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Fetch frozen and external inputs
        run: bash ci/world_fetch.sh "$CHECKLIST_DATA_DIR"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: xbrl-v2-source
          path: ${{ github.workspace }}/world_in/data-ext
      - name: Build real multi-timeframe smoke snapshot
        id: build
        run: python world_snapshot_v2.py --out world-smoke --shards 1 --tickers AAPL,MSFT,NVDA,GE,ARQT,BLZE
      - name: Rebuild every column with future inputs removed
        id: leak
        run: python -m ci.world_v2_leak --tickers AAPL,MSFT,NVDA,GE,ARQT,BLZE --out world-smoke/WORLD_LEAK.json
      - name: Measured coverage gate (fail closed)
        id: coverage
        if: always() && steps.build.outcome == 'success'
        run: python -m ci.world_v2_coverage --shards world-smoke/world_shard_*_part_*.parquet --out world-smoke --gate
      - name: Preserve evidence even when a gate fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-v2-evidence
          path: |
            world-smoke/*.parquet
            world-smoke/*.json
            world-smoke/*.csv
      - name: Publish separate immutable provisional smoke release
        if: always() && steps.build.outcome == 'success'
        run: |
          tag="world-smoke-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "PROVISIONAL smoke only. See measured coverage and leak verdicts. All legacy assets preserved; this is not a complete or approved world state."
          shopt -s nullglob
          files=(world-smoke/*.parquet world-smoke/*.json world-smoke/*.csv)
          gh release upload "$tag" "${files[@]}"
