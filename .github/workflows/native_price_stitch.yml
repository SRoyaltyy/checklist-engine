name: native-price-verified-stitch
on:
  pull_request:
    paths: ['ci/native_price_stitch.py', 'ci/NATIVE_PRICE_STITCH_REQUEST.json', 'tests/test_world_native_stitch.py', '.github/workflows/native_price_stitch.yml']
  workflow_run:
    workflows: [compact-price-failed-shard-recovery]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_run:
        description: Successful compact recovery run to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-price-verified-stitch
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_native_stitch.py tests/test_world_native_blocks.py tests/test_world_native_transport.py tests/test_world_price_base.py tests/test_world_release_assets.py -q
  stitch:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_RUN: ${{ github.event.workflow_run.id || inputs.base_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.native_price_stitch --directory verified-stitch --base-run "$BASE_RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stitch-status
          path: |
            verified-stitch/*.json
            verified-stitch/*.csv
          if-no-files-found: ignore
