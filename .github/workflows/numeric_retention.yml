name: full-numeric-retention-measurement
on:
  push:
    branches: [codex/lossless-native-values]
    paths: ['ci/NUMERIC_RETENTION_REQUEST.json']
  pull_request:
    paths: ['world_numeric_codec.py', 'ci/numeric_retention_measure.py', 'ci/NUMERIC_RETENTION_REQUEST.json', 'tests/test_world_numeric_codec.py', '.github/workflows/numeric_retention.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-numeric-retention-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_numeric_codec.py tests/test_world_answer_cache.py -q
  measure:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.numeric_retention_measure --directory numeric-retention
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-numeric-retention-measurement
          path: numeric-retention/NUMERIC_RETENTION_MEASURED.json
          if-no-files-found: ignore
