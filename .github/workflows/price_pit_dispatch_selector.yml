name: price-pit-dispatch-selector
on:
  push:
    branches: [codex/price-full-cohort-pit]
    paths: ['ci/PRICE_PIT_DISPATCH_SELECTOR_REQUEST.json']
  pull_request:
    paths: ['ci/price_pit_dispatch_selector.py', 'ci/PRICE_PIT_DISPATCH_SELECTOR_REQUEST.json', 'tests/test_price_pit_dispatch_selector.py', '.github/workflows/price_pit_dispatch_selector.yml']
permissions:
  contents: read
concurrency:
  group: price-pit-dispatch-selector-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_price_pit_dispatch_selector.py -q
      - id: request
        run: |
          python - <<'PY'
          import json, os
          from ci.price_pit_dispatch_selector import validate_request
          request = validate_request(json.load(open('ci/PRICE_PIT_DISPATCH_SELECTOR_REQUEST.json')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('execute=' + str(request['execute']).lower() + '\n')
          PY
  measure:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ticker: [AQMS, AZIO, BYRN, AVGO, CHCO, DB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_pit_dispatch_selector ticker --directory selector-${{ matrix.ticker }} --ticker ${{ matrix.ticker }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-pit-dispatch-selector-${{ matrix.ticker }}
          path: |
            selector-${{ matrix.ticker }}/*.selector.json
            selector-${{ matrix.ticker }}/*.pit.json.gz
          if-no-files-found: error
  finalize:
    needs: [verify, measure]
    if: ${{ always() && needs.verify.outputs.execute == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: price-pit-dispatch-selector-*
          merge-multiple: true
          path: selector-final
      - run: python -m ci.price_pit_dispatch_selector finalize --directory selector-final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-pit-dispatch-selector-final
          path: selector-final/PRICE_PIT_DISPATCH_SELECTOR_V1.json
          if-no-files-found: ignore
