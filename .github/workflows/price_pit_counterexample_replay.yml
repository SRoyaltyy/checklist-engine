name: price-pit-counterexample-replay
on:
  push:
    branches: [codex/price-full-cohort-pit]
    paths: ['ci/PRICE_PIT_COUNTEREXAMPLE_REPLAY_REQUEST.json']
  pull_request:
    paths: ['ci/price_pit_counterexample_replay.py', 'ci/PRICE_PIT_COUNTEREXAMPLE_REPLAY_REQUEST.json', 'tests/test_price_pit_counterexample_replay.py', '.github/workflows/price_pit_counterexample_replay.yml']
permissions:
  contents: read
concurrency:
  group: price-pit-counterexample-replay-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_price_pit_counterexample_replay.py -q
      - id: request
        run: |
          python - <<'PY'
          import json, os
          from ci.price_pit_counterexample_replay import validate_request
          request = validate_request(json.load(open('ci/PRICE_PIT_COUNTEREXAMPLE_REPLAY_REQUEST.json')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('execute=' + str(request['execute']).lower() + '\n')
          PY
  diagnose:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_pit_counterexample_replay --directory price-pit-repeats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-pit-counterexample-replay-${{ github.run_id }}
          path: price-pit-repeats/PRICE_PIT_COUNTEREXAMPLE_REPLAY_V1.json
          if-no-files-found: ignore
