name: nyse-tick-source-probe
on:
  push:
    branches: [codex/phase1-gap-sources]
    paths: ['ci/TICK_SOURCE_REQUEST.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3'
      - run: python -m ci.nyse_tick_source_probe
      - uses: actions/upload-artifact@v4
        with:
          name: nyse-tick-source-probe
          path: tick-source/
      - name: Publish immutable evidence
        run: |
          tar -czf nyse_tick_source.tar.gz tick-source
          sha256sum nyse_tick_source.tar.gz > nyse_tick_source.sha256
          tag="nyse-tick-source-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" nyse_tick_source.tar.gz nyse_tick_source.sha256 --title "$tag" --notes "Free-source probes only, no complete-history claim." --target "$GITHUB_SHA"
      - name: Put measured source-attempt log on main
        run: |
          cp tick-source/NYSE_TICK_SOURCE_PROBE_V1.json /tmp/
          git fetch origin main
          git checkout -B nyse-tick-source-publication origin/main
          cp /tmp/NYSE_TICK_SOURCE_PROBE_V1.json docs/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/NYSE_TICK_SOURCE_PROBE_V1.json
          git commit -m "Publish NYSE TICK source attempts without proxy or completeness claims"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
