name: codex-chart-native-default-sample
on:
  push:
    branches: [codex/native-chart-tags]
    paths: ['ci/CHART_NATIVE_REQUEST.json']
  pull_request:
    paths: ['world_chart_picture.py', 'ci/chart_native_measure.py', 'tests/test_world_chart_picture.py', '.github/workflows/chart_native_measure.yml']
permissions:
  contents: write
concurrency:
  group: codex-chart-native-default-sample-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m pytest tests/test_world_chart_picture.py tests/test_chart_native_measure.py tests/test_native_relative_context.py tests/test_relative_native_measure.py -q
      - if: github.event_name == 'push'
        run: python -m ci.chart_native_measure --directory chart-native-proof
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: chart-native-default-proof
          path: chart-native-proof/*.json
          if-no-files-found: ignore
