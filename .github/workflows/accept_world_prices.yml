name: accept-published-price-source
on:
  push:
    branches: [codex/phase1-price-acceptance]
    paths: ['ci/accept_world_prices.py','tests/test_world_price_acceptance.py','.github/workflows/accept_world_prices.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_world_price_acceptance.py -q
      - name: Read existing immutable evidence only
        run: |
          mkdir -p source-acceptance-input
          gh run download 40281068048 -n full-universe-price-bridge-audit -D source-acceptance-input/prices
          gh run download 40266650698 -n world-input-universe-audit -D source-acceptance-input/listings
          gh api 'repos/SRoyaltyy/checklist-engine/contents/docs/EXCLUDED.csv?ref=main' --jq .content | base64 -d > source-acceptance-input/EXCLUDED.csv
          python -m ci.accept_world_prices
      - uses: actions/upload-artifact@v4
        with:
          name: price-source-acceptance-v6
          path: price-source-acceptance/
      - name: Publish versioned acceptance evidence
        run: |
          tag="price-source-acceptance-v6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" price-source-acceptance/* --title "$tag" --notes "Acceptance of existing immutable price sources after explicit exclusions. Not a measured full-world or historical tradeability gate." --target "$GITHUB_SHA"
      - name: Put acceptance proof on main
        run: |
          mkdir -p /tmp/price-source-acceptance
          cp price-source-acceptance/* /tmp/price-source-acceptance/
          git fetch origin main
          git checkout -B price-source-acceptance-publication origin/main
          cp /tmp/price-source-acceptance/* docs/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PRICE_SOURCE_ACCEPTANCE_V6.json docs/ACCEPTED_PRICE_INVENTORY_V6.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish price source acceptance after explicit exclusions; no world-gate claim"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
