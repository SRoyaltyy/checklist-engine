name: numeric-retention-reencode-measurement
on:
  push:
    branches: [codex/lossless-native-values]
    paths: ['ci/NUMERIC_REENCODE_REQUEST.json']
permissions:
  contents: write
concurrency:
  group: numeric-retention-reencode-measurement
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - id: tests
        run: python -m pytest tests/test_numeric_recompute_measure.py tests/test_numeric_reencode_measure.py tests/test_world_numeric_codec.py tests/test_numeric_retention_budget.py tests/test_world_answer_cache.py -q
      - run: python -m ci.numeric_recompute_measure --directory numeric-recompute
      - if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m ci.numeric_reencode_measure --directory numeric-reencode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-reencode-measurement
          path: |
            numeric-reencode/NUMERIC_REENCODE_MEASURED.json
            numeric-reencode/*/REENCODE_STOCK.json
            numeric-reencode/*/worker.log
            numeric-recompute/NUMERIC_RECOMPUTE_MEASURED.json
            numeric-recompute/*/RECOMPUTE_STOCK.json
            numeric-recompute/etf/ETF_RECOMPUTE.json
            numeric-recompute/*/worker.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: numeric-reencode-values-on-failure
          path: |
            numeric-reencode/*/*.all_native_values.tar.zst
            !numeric-reencode/source/**
          if-no-files-found: ignore
