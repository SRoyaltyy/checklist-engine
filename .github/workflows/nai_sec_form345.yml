name: nai-sec-form345
on:
  workflow_dispatch: {}
  schedule: [{cron: '29 23 5 * *'}]
permissions: {contents: read}
concurrency: {group: nai-sec-form345, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pyarrow==26.0.0
      - run: python -m unittest discover -s tests -p 'test_sec_quarterly*.py' -v
  run:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: {contents: write, actions: read}
    env:
      PRIMARY_ACTION_RELAY_URL: ${{ secrets.PRIMARY_ACTION_RELAY_URL }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pyarrow==26.0.0
      - run: python scripts/nai/sec_datasets.py form345
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-form345-fixed-receipt-${{ github.run_id }}
          path: sec-quarterly-fixed-output/SEC_QUARTERLY_FIXED_FIELDS_V2.json
          if-no-files-found: ignore
