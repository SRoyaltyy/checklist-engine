name: nai-sec-form345
on:
  workflow_dispatch: {}
  schedule: [{cron: '29 23 5 * *'}]
permissions: {contents: write}
concurrency: {group: nai-sec-form345, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyarrow pandas
      - run: python scripts/nai/sec_datasets.py form345
