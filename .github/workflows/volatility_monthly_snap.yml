name: volatility-monthly-snap
on:
  push:
    branches: [cursor/session-factor-followon-c9e9]
    paths: ['.github/workflows/volatility_monthly_snap.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: PYTHONPATH=. python ci/check_volatility_monthly_snap.py
