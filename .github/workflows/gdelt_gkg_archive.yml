name: gdelt-official-gkg-archive-source
on:
  push:
    branches: [codex/gdelt-archive-source]
    paths: ['ci/GDELT_GKG_ARCHIVE_REQUEST.json']
  pull_request:
    paths: ['fetch/gdelt_gkg_archive.py', 'tests/test_gdelt_gkg_archive.py', 'ci/GDELT_GKG_ARCHIVE_REQUEST.json', '.github/workflows/gdelt_gkg_archive.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gdelt-official-gkg-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_gdelt_gkg_archive.py tests/test_gdelt_source_probe.py tests/test_world_release_assets.py -q
  capture:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m fetch.gdelt_gkg_archive --directory gdelt-gkg-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdelt-gkg-numeric-source
          path: gdelt-gkg-source/GDELT_GKG_SOURCE_REPORT.json
          if-no-files-found: ignore
