name: price-column-availability
on:
  push:
    branches: [gpt/price-column-availability-v1]
    paths: ['ci/PRICE_COLUMN_AVAILABILITY_REQUEST.json']
  pull_request:
    paths: ['world_price_availability.py', 'dictionary/PRICE_COLUMN_AVAILABILITY_V1.*', 'ci/price_column_availability_probe.py', 'ci/PRICE_COLUMN_AVAILABILITY_REQUEST.json', 'tests/test_price_column_availability*.py', '.github/workflows/price_column_availability.yml']
permissions:
  contents: read
concurrency:
  group: price-column-availability-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pytest numpy==2.5.4 pandas==2.3.3
      - run: python -m pytest tests/test_price_column_availability.py tests/test_price_column_availability_probe.py -q
      - id: request
        run: |
          python - <<'PY'
          import json, os
          from ci.price_column_availability_probe import validate_request
          request = validate_request(json.load(open('ci/PRICE_COLUMN_AVAILABILITY_REQUEST.json')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('execute=' + str(request['execute']).lower() + '\n')
          PY
  proof:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_column_availability_probe run --directory column-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-column-availability-${{ github.run_id }}
          path: |
            column-proof/*.json
            column-proof/*.csv
            column-proof/stocks/*/worker.log
          if-no-files-found: ignore
