name: completed-event-source-audit
on:
  push:
    branches: [main]
    paths: ['ci/EVENT_SOURCE_AUDIT_REQUEST.json']
  workflow_dispatch:
  pull_request:
    paths: ['ci/event_source_audit.py', 'ci/EVENT_SOURCE_AUDIT_REQUEST.json', 'tests/test_event_source_audit.py', '.github/workflows/event_source_audit.yml']
permissions:
  contents: read
concurrency:
  group: completed-event-audit-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_event_source_audit.py tests/test_event_history.py tests/test_world_release_assets.py -q
  audit:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.event_source_audit --directory event-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-event-source-audit
          path: event-audit/EVENT_SOURCE_AUDIT.json
          if-no-files-found: ignore
