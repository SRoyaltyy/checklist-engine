name: dia-index-source-evidence
on:
  push:
    branches: [cursor/dia-index-source-c9e9]
    paths: ['.github/workflows/dia_index_source_evidence.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.verify_index_extra_handoff
