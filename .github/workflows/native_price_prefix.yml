name: native-price-prefix-smoke
on:
  push:
    branches: [codex/native-world-blocks-v1]
    paths: ['ci/NATIVE_PRICE_PREFIX_REQUEST.json']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.audit_native_price_prefix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-price-prefix-smoke
          path: native-prefix/*.json
