# Leak-sweep FAIL verifier (tests/leak_verify_history.py): proves the col_set_diff flags from
# sweep run 40099037308 are "not enough history yet" gaps (bars(ticker, <= D) < 15 k-day bars),
# not lookahead. Any counterexample = real lookahead = FAIL. Exit 0 = PASS.
# Dispatch-only; heavy compute stays on the runner. 2020-24 input data only.
name: leak-verify
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE: data-2020-24-v1
  SWEEP_RUN: "40099037308"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi/step-a-wincompat
      - name: Python + system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential wget
          python3 -m pip install -q --upgrade pip
      - name: TA-Lib C library + Python wrapper
        run: |
          cd /tmp && wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz \
            && tar xzf ta-lib-0.4.0-src.tar.gz && cd ta-lib \
            && ./configure --prefix=/usr >/dev/null && sudo make -s install >/dev/null
          python3 -m pip install -q TA-Lib pandas numpy pyarrow
      - name: Download data release + verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/fetch_release.sh "$RELEASE" "$RUNNER_TEMP/data"
      - name: Run leak FAIL verifier
        env:
          CHECKLIST_DATA_DIR: ${{ runner.temp }}/data
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SWEEP_RUN: ${{ env.SWEEP_RUN }}
        run: python3 -X utf8 tests/leak_verify_history.py
