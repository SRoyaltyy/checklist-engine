name: outside-event-calendar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outside-event-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the calendar dependencies
        run: python -m pip install "numpy>=2,<3" "pandas>=2.2,<3" "pyarrow>=18" "pytest>=8,<10" "exchange_calendars==4.13.2"
      - name: Unit tests
        run: python -m pytest tests/test_outside_calendar.py -q
      - name: Build the calendar flags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ci.outside_event_calendar --out outside-calendar-out --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outside-event-calendar-proof
          path: outside-calendar-out/OUTSIDE_EVENT_CALENDAR_PROOF.json
          if-no-files-found: ignore
