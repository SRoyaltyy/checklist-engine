name: outside-event-calendar

on:
workflow_dispatch:
push:
paths:
- "outside_calendar.py"
- "tests/test_outside_calendar.py"
- ".github/workflows/outside_event_calendar.yml"

permissions:
contents: write

concurrency:
group: outside-event-calendar-${{ github.ref }}
cancel-in-progress: true

jobs:
test:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
with:
ref: ${{ github.ref_name }}

- uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      python -m pip install pytest

  - name: Run tests, tee everything to agent/TEST_LOG.txt
    id: pytest
    shell: bash
    run: |
      mkdir -p agent
      {
        echo "run_id: ${{ github.run_id }}"
        echo "ref: ${{ github.ref_name }}"
        echo "sha: ${{ github.sha }}"
        echo "----"
      } > agent/TEST_LOG.txt
      set +e
      python -m pytest tests/test_outside_calendar.py -q --tb=long -p no:cacheprovider 2>&1 | tee -a agent/TEST_LOG.txt
      code=${PIPESTATUS[0]}
      echo "exit_code=$code" >> agent/TEST_LOG.txt
      echo "code=$code" >> "$GITHUB_OUTPUT"
      exit $code

  - name: Commit log on failure
    if: failure()
    shell: bash
    run: |
      git config user.name "venice-wake"
      git config user.email "venice@users.noreply.github.com"
      git add -f agent/TEST_LOG.txt
      git commit -m "ci: failure log for run ${{ github.run_id }}" || exit 0
      git push origin HEAD:${{ github.ref_name }} || exit 0
