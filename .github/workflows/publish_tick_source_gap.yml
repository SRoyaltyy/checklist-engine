name: publish-tick-source-gap
on:
  push:
    branches: [codex/phase1-gap-sources]
    paths: ['ci/TICK_EXCLUSION_REQUEST.json']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Log tested-source exclusion on current main
        run: |
          cp ci/log_tick_source_gap.py /tmp/log_tick_source_gap.py
          git fetch origin main
          git checkout -B tick-gap-publication origin/main
          python /tmp/log_tick_source_gap.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/WORLD_COVERAGE.csv docs/NYSE_TICK_SOURCE_EXCLUSION_V1.json
          git commit -m "Log tested free NYSE TICK history gap; no zero column or price change"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
