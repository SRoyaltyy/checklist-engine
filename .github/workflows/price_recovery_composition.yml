name: price-recovery-explicit-composition
on:
  push:
    branches: [codex/price-recovery-composition]
    paths: ['ci/PRICE_RECOVERY_COMPOSITION_REQUEST.json']
  pull_request:
    paths: ['ci/price_recovery_composition.py', 'ci/PRICE_RECOVERY_COMPOSITION_REQUEST.json', 'tests/test_price_recovery_composition.py', '.github/workflows/price_recovery_composition.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: price-recovery-composition-${{ github.event_name }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_price_recovery_composition.py -q
      - id: request
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request=json.loads(Path('ci/PRICE_RECOVERY_COMPOSITION_REQUEST.json').read_bytes())
          assert type(request['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('execute='+str(request['execute']).lower()+'\n')
          PY
  compose:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.execute == 'true'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m ci.price_recovery_composition --directory price-composition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-composition-state
          path: price-composition/COMPACT_WORLD_BUILD_COMPOSED.json
          if-no-files-found: ignore
