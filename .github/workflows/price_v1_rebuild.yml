name: price-v1-guarded-full-rebuild
on:
  push:
    branches: [codex/price-v1-guarded-rebuild]
    paths: ['ci/PRICE_V1_REBUILD_REQUEST.json']
  pull_request:
    paths: ['ci/price_v1_rebuild.py', 'ci/PRICE_V1_REBUILD_REQUEST.json', 'tests/test_price_v1_rebuild.py', '.github/workflows/price_v1_rebuild.yml', 'world_answer_cache.py', 'ci/compact_world_build.py', 'ci/compact_world_storage_budget.py', 'ci/COMPACT_WORLD_BUILD_REQUEST.json', 'tests/test_compact_world_build.py', '.github/workflows/compact_world_build.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: price-v1-guarded-full-rebuild-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: git fetch --depth=1 origin 7dcaa48680daeac9a6025c09f9e4d138f5fcbda5
      - run: python -m pytest tests/test_world_answer_cache.py tests/test_compact_world_build.py tests/test_accepted_price_stitch.py tests/test_renko_recipe.py tests/test_price_v1_rebuild.py -q
  prepare:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      inputs_release: ${{ steps.plan.outputs.inputs_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - id: plan
        run: python -m ci.price_v1_rebuild --directory compact-world-plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-world-build-plan
          path: compact-world-plan/COMPACT*.json
          if-no-files-found: ignore
  build:
    needs: prepare
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 310
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.compact_world_build build --directory compact-world --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-world-shard-${{ matrix.index }}
          path: compact-world/COMPACT_WORLD_SHARD.json
          if-no-files-found: ignore
  measure:
    needs: [prepare,build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.compact_world_build merge --directory compact-world-measured --inputs-release '${{ needs.prepare.outputs.inputs_release }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-world-build-measured
          path: compact-world-measured/COMPACT_WORLD_BUILD_MEASURED.json
          if-no-files-found: ignore
