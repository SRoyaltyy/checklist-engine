name: codex-fred-formal-pit-proof
on:
  push:
    branches: [codex/fred-formal-pit-proof]
    paths: ['ci/FRED_PIT_REQUEST.json']
  pull_request:
    paths: ['ci/fred_pit_measure.py', 'ci/FRED_PIT_REQUEST.json', 'tests/test_fred_pit_measure.py', '.github/workflows/fred_pit_measure.yml']
permissions:
  contents: write
concurrency:
  group: codex-fred-formal-pit-proof-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m pytest tests/test_fred_pit_measure.py tests/test_world_fred.py tests/test_world_context_store.py -q
      - if: github.event_name == 'push'
        run: python -m ci.fred_pit_measure --directory fred-pit-proof
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: fred-formal-pit-proof
          path: fred-pit-proof/*.json
          if-no-files-found: ignore
