name: industry-etf-compare-evidence
on:
  push:
    branches: [cursor/industry-etf-compare-c9e9]
    paths: ['.github/workflows/industry_etf_compare_evidence.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: PYTHONPATH=. python ci/check_industry_etf_compare.py
