name: price-pit-missing-recovery
on:
  push:
    branches: [codex/price-full-cohort-pit]
    paths: ['ci/PRICE_PIT_MISSING_RECOVERY_REQUEST.json']
  pull_request:
    paths: ['ci/price_pit_missing_recovery.py', 'ci/PRICE_PIT_MISSING_RECOVERY_REQUEST.json', 'tests/test_price_pit_missing_recovery.py', '.github/workflows/price_pit_missing_recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: price-pit-missing-recovery-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_price_pit_missing_recovery.py -q
      - id: request
        run: |
          python - <<'PY'
          import json, os
          from ci.price_pit_missing_recovery import validate_request
          r = validate_request(json.load(open('ci/PRICE_PIT_MISSING_RECOVERY_REQUEST.json')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('execute=' + str(r['execute']).lower() + '\n')
          PY
  prepare:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      inputs_release: ${{ steps.plan.outputs.inputs_release }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m ci.price_pit_missing_recovery prepare --directory recovery-plan
        id: plan
  control:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 285
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_pit_missing_recovery recover --directory recovery-control --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --plan-sha256 '${{ needs.prepare.outputs.plan_sha256 }}' --index 34
  recover:
    needs: [prepare, control]
    runs-on: ubuntu-latest
    timeout-minutes: 285
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_pit_missing_recovery recover --directory recovery-part --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --plan-sha256 '${{ needs.prepare.outputs.plan_sha256 }}' --index '${{ matrix.index }}'
  finalize:
    needs: [prepare, control, recover]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_pit_missing_recovery finalize --directory recovery-final --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --plan-sha256 '${{ needs.prepare.outputs.plan_sha256 }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-pit-missing-recovery-${{ github.run_id }}
          path: recovery-final/PRICE_FULL_COHORT_PIT*
          if-no-files-found: ignore
