# Combiner predict phase: builds per-year strategy maps (argmax-EV exit policy + P(win) for
# every trade) once both model targets are published. Dispatched by the second combiner fit
# job to finish; hourly schedule as backstop. Outputs: strategy_map_YYYY.parquet +
# predict_summary.json on release combine-2020-22-v1.
name: combiner-predict
on:
  workflow_dispatch:
  schedule:
    - cron: '9 * * * *'
permissions:
  contents: write
env:
  RELEASE: data-2020-24-v1
  GRID_RELEASE: grid-2020-22-v1
  MODEL_RELEASE: combine-2020-22-v1
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi/exit-grid
      - name: Python + deps (no TA-Lib; the combiner only reads npz/parquet)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q pandas numpy pyarrow
      - name: Download data release + verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/fetch_release.sh "$RELEASE" "$RUNNER_TEMP/data"
      - name: Build strategy maps when models are ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/combine_predict.sh
