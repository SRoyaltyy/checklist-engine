name: oi-source-profile
on:
  push:
    branches: [gpt/options-oi-retained-v2]
    paths: ['ci/OI_SOURCE_PROFILE_REQUEST.json']
  pull_request:
    paths: ['ci/oi_source_profile.py', 'ci/OI_SOURCE_PROFILE_REQUEST.json', 'tests/test_oi_source_profile.py', '.github/workflows/oi_source_profile.yml']
permissions: {contents: read}
concurrency: {group: oi-source-profile, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pyarrow==26.0.0
      - run: python -m unittest discover -s tests -p 'test_oi_source_profile.py' -v
      - id: request
        run: |
          python - <<'PY'
          import json,os
          from ci.oi_source_profile import validate_request
          request=validate_request(json.load(open('ci/OI_SOURCE_PROFILE_REQUEST.json')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('execute='+str(request['execute']).lower()+'\n')
          PY
  observe:
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: write}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pyarrow==26.0.0
      - run: python -m ci.oi_source_profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oi-source-profile-${{ github.run_id }}
          path: oi-source-profile-output/OI_SOURCE_PROFILE_V1.json
          if-no-files-found: ignore
