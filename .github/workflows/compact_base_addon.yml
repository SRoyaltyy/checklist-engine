name: compact-price-completed-add-on
on:
  push:
    branches: [codex/compact-base-add-on]
    paths: ['ci/COMPACT_BASE_ADDON_REQUEST.json']
  pull_request:
    paths: ['ci/compact_base_addon.py', 'ci/native_price_base.py', 'ci/COMPACT_BASE_ADDON_REQUEST.json', 'tests/test_compact_base_addon.py', '.github/workflows/compact_base_addon.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_compact_base_addon.py tests/test_world_price_base.py tests/test_world_release_assets.py -q
  merge:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.compact_base_addon --directory compact-add-on
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-base-add-on
          path: |
            compact-add-on/*.json
            compact-add-on/*.csv
          if-no-files-found: ignore
