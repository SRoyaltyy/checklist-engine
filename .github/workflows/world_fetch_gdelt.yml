name: world_fetch_gdelt
# Block O / I200: GDELT 2.0 mention counts per ticker -> data-ext/gdelt_counts_2020_26.parquet.
# GDELT free-tier pace is ~1 req / 5s, so this is a LONG-HAUL sharded job: each
# dispatch covers --count tickers starting at --offset; re-dispatch with the next
# offset (or the same one -- it resumes and skips finished tickers). Smoke with
# offset 0 / count 20 first to validate the API payload shape.

on:
  workflow_dispatch:
    inputs:
      offset:
        description: ticker offset into the sorted universe
        default: '0'
        required: true
      count:
        description: tickers to cover this dispatch (0 = rest of universe)
        default: '50'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi/world-snapshot
      - name: Install deps
        run: python3 -m pip install -q pandas pyarrow
      - name: Download universe + previous counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/gd"
          cd "$RUNNER_TEMP/gd"
          gh release download data-2020-24-v1 -p 'universe_2020_survivors_le2024.parquet'
          gh release download data-ext-2020-26-v1 -p 'gdelt_counts_2020_26.parquet' \
            && echo "resume base found" || echo "no previous counts (fresh run)"
      - name: Fetch GDELT mention counts
        run: |
          cd "$RUNNER_TEMP/gd"
          ARGS="--universe universe_2020_survivors_le2024.parquet --out gdelt_counts_2020_26.parquet --offset ${{ inputs.offset }} --count ${{ inputs.count }}"
          [ -f gdelt_counts_2020_26.parquet ] && ARGS="$ARGS --resume" || true
          python3 "$GITHUB_WORKSPACE/fetch/fetch_gdelt.py" $ARGS
      - name: Upload to data-ext-2020-26-v1
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f="$RUNNER_TEMP/gd/gdelt_counts_2020_26.parquet"
          [ -f "$f" ] && python3 ci/release_assets.py upload data-ext-2020-26-v1 "$f" \
            || echo "no output to upload"
