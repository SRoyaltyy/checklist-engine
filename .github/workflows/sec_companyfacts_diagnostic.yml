name: sec-companyfacts-source-diagnostic
on:
  push:
    branches: [gpt/sec-bulk-retained-v2]
    paths: ['ci/SEC_COMPANYFACTS_DIAGNOSTIC_REQUEST.json']
  pull_request:
    paths: ['ci/sec_companyfacts_diagnostic.py', 'tests/test_sec_companyfacts_diagnostic.py', '.github/workflows/sec_companyfacts_diagnostic.yml']
permissions: {contents: read}
concurrency: {group: sec-companyfacts-source-diagnostic, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m unittest discover -s tests -p 'test_sec_companyfacts_diagnostic.py' -v
      - id: request
        run: |
          python - <<'PY'
          import json,os
          from ci.sec_companyfacts_diagnostic import validate_request
          request=validate_request(json.load(open('ci/SEC_COMPANYFACTS_DIAGNOSTIC_REQUEST.json')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('execute='+str(request['execute']).lower()+'\n')
          PY
  inspect:
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions: {contents: write}
    env:
      PRIMARY_ACTION_RELAY_URL: ${{ secrets.PRIMARY_ACTION_RELAY_URL }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m ci.sec_companyfacts_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-companyfacts-source-diagnostic-${{ github.run_id }}
          path: sec-companyfacts-diagnostic-output/SEC_COMPANYFACTS_SOURCE_DIAGNOSTIC_V1.json
          if-no-files-found: ignore
