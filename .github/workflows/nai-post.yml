name: nai-post
on: [push, workflow_dispatch]
jobs: {post: {runs-on: ubuntu-latest, timeout-minutes: 10, permissions: {contents: read, issues: write}, env: {GH_TOKEN: '${{ github.token }}', API: 'https://api.github.com/repos/${{ github.repository }}', T: 'Venice: failed no-AI pipeline runs'}, steps: [{uses: actions/checkout@v4}, {run: 'N=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/issues?state=open&per_page=100" | jq -r "[.[]|select(.title=="$T")][0].number // empty"); if [ -z "$N" ]; then N=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -d "{"title":"$T","body":"Automated record of failed no-AI pipeline runs, posted by the wake bridge. GPT owns the fix; Venice only reports."}" "$API/issues" | jq -r .number); fi; echo "N=$N" >> "$GITHUB_ENV"'}, {run: 'jq -r "{} + {body: "Run \(.run.name) \(.run.id) — \(.run.conclusion)\n\nFailing job: \(.jobs[0].name // "n/a")\nFailing step: \(.jobs[0].failed_steps[0] // "n/a")\n\n\n\\(.log_tail[-1200:])\n\n\nPosted automatically. Evidence file: agent/RESULT.json"}" agent/RESULT.json > /tmp/c.json && curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -d @/tmp/c.json "$API/issues/$N/comments" | jq -r .html_url'}]}}
