name: breadth-derived-evidence
# Recompute from the public breadth release, not the draft rebuild tag.
on:
  push:
    branches: [cursor/breadth-derived-c9e9]
    paths: ['.github/workflows/breadth_derived_evidence.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: PYTHONPATH=. python -m pytest tests/test_breadth_derived.py -q
      - run: PYTHONPATH=. python ci/check_breadth_derived.py
