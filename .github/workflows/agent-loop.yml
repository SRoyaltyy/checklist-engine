name: agent-loop

on:
  workflow_dispatch:
    inputs:
      max_iterations:
        default: "30"
      max_minutes:
        default: "45"

concurrency:
  group: agent-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy>=2,<3" "pandas>=2.2,<3" "pyarrow>=18" "pytest>=8,<10" "exchange_calendars==4.13.2"
      - run: python agent/loop.py
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          DOORMAN_KEY: ${{ secrets.DOORMAN_KEY }}
          AGENT_BRANCH: ${{ github.ref_name }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          MAX_MINUTES: ${{ inputs.max_minutes }}