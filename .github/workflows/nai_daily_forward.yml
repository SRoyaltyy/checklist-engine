name: nai-daily-forward
on:
  workflow_dispatch: {}
  schedule: [{cron: '15 0 * * 2-6'}]
permissions: {contents: write}
concurrency: {group: nai-daily-forward, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/nai/daily_forward.py
