# Impact diff: before/after answers for the dictionary-fixes branch vs its base (kimi/exit-grid).
# Runs a fixed ticker sample through BOTH engines and uploads impact_diff.json.
name: impact-diff
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'comma-separated tickers (default sample of 12)'
        required: false
permissions:
  contents: write
env:
  RELEASE: data-2020-24-v1
  BASE_REF: kimi/exit-grid
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Python + system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential wget git
          python3 -m pip install -q --upgrade pip
      - name: TA-Lib C library + Python wrapper
        run: |
          cd /tmp && wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz \
            && tar xzf ta-lib-0.4.0-src.tar.gz && cd ta-lib \
            && ./configure --prefix=/usr >/dev/null && sudo make -s install >/dev/null
          python3 -m pip install -q TA-Lib pandas numpy pyarrow
      - name: Download data release + verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/fetch_release.sh "$RELEASE" "$RUNNER_TEMP/data"
      - name: Check out base engine (kimi/exit-grid)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin "$BASE_REF"
          git worktree add /tmp/base-engine "origin/$BASE_REF" --detach
      - name: Build ticker sample
        run: |
          TICKERS="${{ github.event.inputs.tickers }}"
          echo "${TICKERS:-AAPL,KO,NVDA,MSFT,TSLA,AMZN,META,GOOGL,JPM,XOM,PFE,WMT}" | tr ',' ' ' > /tmp/tickers.txt
          cat /tmp/tickers.txt
      - name: Run base engine
        env:
          CHECKLIST_DATA_DIR: ${{ runner.temp }}/data
        run: python3 ci/impact_diff.py run /tmp/base-engine /tmp/out-base /tmp/tickers.txt
      - name: Run branch engine
        env:
          CHECKLIST_DATA_DIR: ${{ runner.temp }}/data
        run: python3 ci/impact_diff.py run "$GITHUB_WORKSPACE" /tmp/out-branch /tmp/tickers.txt
      - name: Diff answers
        run: python3 ci/impact_diff.py diff /tmp/out-base /tmp/out-branch
      - name: Upload impact_diff.json
        uses: actions/upload-artifact@v4
        with:
          name: impact-diff
          path: impact_diff.json
