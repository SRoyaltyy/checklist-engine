name: nai-verdict
on: [push, workflow_dispatch]
jobs: {collect: {runs-on: ubuntu-latest, timeout-minutes: 10, permissions: {contents: write, actions: read}, env: {GH_TOKEN: '${{ github.token }}'}, steps: [{uses: actions/checkout@v4}, {run: 'python scripts/nai/probe_result.py ${{ inputs.run_id || ''41413529249'' }}'}, {run: 'git config user.name nai-verdict && git config user.email nai-verdict@users.noreply.github.com && git add agent/RESULT.json && git commit -m "verdict: run ${{ inputs.run_id || ''41413529249'' }}" && git push'}]}}
