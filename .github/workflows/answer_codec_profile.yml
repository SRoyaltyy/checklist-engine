name: answer-codec-synthetic-profile
on:
  push:
    branches: [codex/binary-answer-codec-vector]
    paths: ['world_answer_cache.py', 'ci/answer_codec_profile.py', 'tests/test_world_answer_cache.py', '.github/workflows/answer_codec_profile.yml']
  pull_request:
    paths: ['world_answer_cache.py', 'ci/answer_codec_profile.py', 'tests/test_world_answer_cache.py', '.github/workflows/answer_codec_profile.yml']
permissions:
  contents: read
concurrency:
  group: answer-codec-profile-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: git fetch --depth=1 origin 9b3957d33b616ed8d12ca6eb6a4b1c24889d8bf4
      - run: git fetch --depth=1 origin 7dcaa48680daeac9a6025c09f9e4d138f5fcbda5
      - run: python -m pytest tests/test_world_answer_cache.py tests/test_compact_world_build.py tests/test_price_v1_rebuild.py -q
      - run: python -m ci.answer_codec_profile --directory codec-profile
      - uses: actions/upload-artifact@v4
        with:
          name: answer-codec-synthetic-profile
          path: codec-profile/ANSWER_CODEC_SYNTHETIC_PROFILE_V1.json
