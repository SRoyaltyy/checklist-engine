name: codex-calendar-pivot-native-sample
on:
  push:
    branches: [codex/prior-calendar-pivots]
    paths: ['ci/CALENDAR_PIVOT_REQUEST.json']
  pull_request:
    paths: ['world_calendar_pivots.py', 'ci/calendar_pivot_measure.py', 'ci/CALENDAR_PIVOT_REQUEST.json', 'tests/test_calendar_pivots.py', 'tests/test_calendar_pivot_measure.py', '.github/workflows/calendar_pivot_measure.yml']
permissions:
  contents: write
concurrency:
  group: codex-calendar-pivot-native-sample-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m pytest tests/test_calendar_pivots.py tests/test_calendar_pivot_measure.py tests/test_native_relative_context.py -q
      - if: github.event_name == 'push'
        run: python -m ci.calendar_pivot_measure --directory calendar-pivot-proof
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: calendar-pivot-native-proof
          path: calendar-pivot-proof/*.json
          if-no-files-found: ignore
