name: outside-market-daily

on:
  workflow_dispatch:
  pull_request:
    paths:
      - outside_market.py
      - ci/outside_market_daily.py
      - tests/test_outside_market.py
      - .github/workflows/outside_market_daily.yml

permissions:
  contents: write

concurrency:
  group: outside-market-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the panel dependencies
        run: python -m pip install "numpy>=2,<3" "pandas>=2.2,<3" "pyarrow>=18" "pytest>=8,<10" "exchange_calendars==4.13.2"
      - name: Unit tests
        run: python -m pytest tests/test_outside_market.py -q
      - name: Build the daily panel and publish the draft release
        run: python -m ci.outside_market_daily --out outside-market-out --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outside-market-daily-proof
          path: outside-market-out/OUTSIDE_MARKET_DAILY_PROOF.json
          if-no-files-found: ignore
