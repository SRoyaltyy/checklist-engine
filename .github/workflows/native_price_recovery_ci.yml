name: native-recovery-code-ci
on:
  pull_request:
    paths: ['ci/native_price_run.py', 'ci/native_price_recovery.py', 'ci/release_assets.py', 'ci/native_price_base_run.py', 'tests/test_world_native_transport.py', 'tests/test_world_native_recovery.py', 'tests/test_world_release_assets.py', '.github/workflows/native_price_recovery_ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_native_recovery.py tests/test_world_native_transport.py tests/test_world_release_assets.py tests/test_world_price_base.py tests/test_world_context_sources.py tests/test_world_empty_recoveries.py -q
