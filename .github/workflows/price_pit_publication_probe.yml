name: price-pit-publication-probe
on:
  push:
    branches: [codex/price-full-cohort-pit]
    paths: ['ci/PRICE_PIT_PUBLICATION_PROBE_REQUEST.json']
permissions:
  contents: write
concurrency:
  group: price-pit-publication-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m ci.price_pit_publication_probe --directory publication-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-pit-publication-probe-${{ github.run_id }}
          path: publication-probe/PRICE_PIT_PUBLICATION_PROBE_V1.json
          if-no-files-found: ignore
