name: nai-post2
on: [push, workflow_dispatch]
jobs: {post: {runs-on: ubuntu-latest, timeout-minutes: 10, permissions: {contents: read, issues: write}, env: {GH_TOKEN: '${{ github.token }}', API: 'https://api.github.com/repos/${{ github.repository }}'}, steps: [{uses: actions/checkout@v4}, {run: 'bash scripts/nai/post.sh'}]}}
