name: question-quality-evidence-contract
on:
  # Standalone evidence-contract tests; PR coverage is in world_v2_ci.yml.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest tests/test_binary_questions.py tests/test_question_quality.py -q
