name: compact-price-failed-shard-recovery
on:
  push:
    branches: [codex/native-price-base-recovery]
    paths: ['ci/NATIVE_PRICE_BASE_RECOVERY_REQUEST.json']
  pull_request:
    paths: ['ci/native_price_base.py', 'ci/native_price_base_recovery.py', 'tests/test_world_price_base.py', '.github/workflows/native_price_base_recovery.yml']
  workflow_run:
    workflows: [native-price-failed-shard-recovery]
    branches: [codex/native-price-failed-shards]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: compact-price-failed-shard-recovery
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.id == 40446419246 && github.event.workflow_run.head_sha == '02977e6ba3c1e2783d1c4305a5f3f8f4811cad57' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_price_base.py tests/test_world_native_recovery.py tests/test_world_release_assets.py -q
  plan:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 80
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python -m ci.native_price_base_recovery plan --directory compact-plan
      - uses: actions/upload-artifact@v4
        with:
          name: compact-recovery-plan
          path: compact-plan/BASE_RECOVERY_PLAN.json
  build:
    needs: plan
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.native_price_base_recovery build --directory compact-recovery --shard '${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-recovery-${{ matrix.shard }}
          path: |
            compact-recovery/BASE_*.json
            compact-recovery/resume/BASE_RESUME.json
          if-no-files-found: ignore
  merge:
    needs: [plan,build]
    permissions:
      contents: write
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.native_price_base_recovery merge --directory compact-measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-measured-status
          path: |
            compact-measured/*.json
            compact-measured/*.csv
          if-no-files-found: ignore
