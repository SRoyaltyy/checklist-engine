name: org-theme-peer-capture-sources
on:
  push:
    branches: [main]
    paths: ['ci/ORG_CONTEXT_SOURCE_REQUEST.json']
  workflow_dispatch:
  pull_request:
    paths: ['fetch/org_context_sources.py', 'ci/ORG_CONTEXT_SOURCE_REQUEST.json', 'tests/test_org_context_sources.py', '.github/workflows/org_context_sources.yml']
permissions:
  contents: read
concurrency:
  group: org-context-captures-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_org_context_sources.py tests/test_world_release_assets.py -q
  acquire:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m fetch.org_context_sources --directory org-context
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: org-context-source-proof
          path: org-context/ORG_SOURCE_STATUS.json
          if-no-files-found: ignore
