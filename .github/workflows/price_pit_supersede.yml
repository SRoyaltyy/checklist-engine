name: price-pit-retire-obsolete-controller
on:
  push:
    branches: [codex/price-full-cohort-pit]
    paths: ['ci/PRICE_PIT_SUPERSEDE_REQUEST.json']
  pull_request:
    paths: ['ci/price_pit_supersede.py', 'ci/PRICE_PIT_SUPERSEDE_REQUEST.json', 'tests/test_price_pit_supersede.py', '.github/workflows/price_pit_supersede.yml']
permissions:
  contents: read
concurrency:
  group: price-pit-retire-obsolete-controller-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_price_pit_supersede.py -q
  retire:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m ci.price_pit_supersede
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-pit-obsolete-controller-readback
          path: PRICE_PIT_SUPERSEDE_READBACK_V1.json
          if-no-files-found: ignore
