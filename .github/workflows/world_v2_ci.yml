name: world-v2-code-ci
on:
  push:
    branches: [main, codex/world-state-v2-integration]
    paths:
      - 'facets_world.py'
      - 'world_*.py'
      - 'price_reconcile.py'
      - 'datapaths.py'
      - 'ci/*.py'
      - 'fetch/*.py'
      - 'tests/test_world*.py'
      - 'tests/test_price_reconcile.py'
      - 'tests/test_question_quality.py'
      - 'requirements-world-v2.txt'
      - '.github/workflows/world_v2*.yml'
  workflow_dispatch:
    inputs:
      sec_relay_confirmed:
        description: Run the live SEC probe only after Cyrus confirms the relay fix
        type: boolean
        required: true
        default: false
  pull_request:
    paths: ['.github/workflows/world_v2_ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Import prerequisite before any source job
        run: python -m ci.world_pipeline run --state .import-state.json --stage imports -- python -m ci.world_pipeline imports
      - name: Regression tests including forced failures
        run: python -m pytest tests/test_world_v2.py tests/test_question_quality.py tests/test_price_reconcile.py tests/test_world_infrastructure.py -q
  sec-source-evidence:
    # James 13:00 HKT, 01059da: SEC stays held until Cyrus confirms the fix.
    # Ordinary code pushes and PR checks must never perform a live SEC probe.
    if: github.event_name == 'workflow_dispatch' && inputs.sec_relay_confirmed == true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRIMARY_ACTION_RELAY_URL: ${{ secrets.PRIMARY_ACTION_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Get verified company identity map and published measured snapshot evidence
        run: |
          python -c "import pandas as pd; pd.DataFrame({'ticker':['AAPL','MSFT','GE']}).to_parquet('source_universe.parquet',index=False)"
          gh release download data-2020-24-v1 -p sec_shares_out_filed_le_2024.parquet -p SHA256SUMS
          grep sec_shares_out_filed_le_2024.parquet SHA256SUMS | sha256sum -c -
          gh release download world-smoke-v2-40213446937-1 -p WORLD_COLUMN_MEASUREMENTS.json
      - name: Real SEC request with required headers and retry
        id: sec
        continue-on-error: true
        run: python -m fetch.fetch_xbrl --universe source_universe.parquet --shards 1 --out sec-source --cik-map-file sec_shares_out_filed_le_2024.parquet
      - name: Validate HTTP 200 data or evidence-backed BLOCKED coverage
        run: python -m ci.source_fetch_status --source-root sec-source --measurements WORLD_COLUMN_MEASUREMENTS.json --out source-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-source-and-coverage-proof
          path: |
            sec-source/
            source-proof/
      - name: Publish provisional source coverage evidence on main
        if: github.ref == 'refs/heads/codex/world-state-v2-integration'
        run: |
          mkdir -p /tmp/source-proof
          cp source-proof/WORLD_COVERAGE.csv source-proof/SEC_SOURCE_STATUS.json /tmp/source-proof/
          git fetch origin main
          git checkout -B source-proof-publication origin/main
          cp /tmp/source-proof/WORLD_COVERAGE.csv docs/WORLD_COVERAGE.csv
          cp /tmp/source-proof/SEC_SOURCE_STATUS.json docs/SEC_SOURCE_STATUS.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/WORLD_COVERAGE.csv docs/SEC_SOURCE_STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish provisional measured coverage and exact SEC source evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
  fred-source:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Live ALFRED rows using the Actions secret
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p fred-source
          python -m fetch.fetch_fred --out fred-source/fred_wide_2020_26.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fred-v2-source
          path: fred-source/
