name: codex-renko-zero-step-proof
on:
  push:
    branches: [codex/renko-zero-step-proof]
    paths: ['ci/RENKO_ZERO_STEP_PROOF_REQUEST.json']
  pull_request:
    paths: ['ci/renko_recipe.py', 'ci/renko_zero_step_proof.py', 'tests/test_renko_recipe.py', 'tests/test_renko_zero_step_proof.py', 'recipes/renko_zero_step_v1/**']
permissions:
  contents: write
concurrency:
  group: codex-renko-zero-step-proof-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: git fetch --depth=1 origin 7dcaa48680daeac9a6025c09f9e4d138f5fcbda5
      - run: python -m pytest tests/test_renko_recipe.py tests/test_renko_zero_step_proof.py tests/test_renko_diagnostic.py tests/test_world_answer_cache.py -q
      - if: github.event_name == 'push'
        run: python -m ci.renko_zero_step_proof --directory renko-proof
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: renko-zero-step-proof
          path: |
            renko-proof/*.json
            renko-proof/*/NUMERIC_PROOF.json
            renko-proof/*/worker.log
          if-no-files-found: ignore
