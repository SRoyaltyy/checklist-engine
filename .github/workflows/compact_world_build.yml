name: compact-world-full-universe-build
on:
  push:
    branches: [codex/compact-world-storage-budget]
    paths: ['ci/COMPACT_WORLD_BUILD_REQUEST.json']
  pull_request:
    paths: ['world_answer_cache.py', 'ci/compact_world_build.py', 'ci/compact_world_storage_budget.py', 'ci/COMPACT_WORLD_BUILD_REQUEST.json', 'tests/test_compact_world_build.py', '.github/workflows/compact_world_build.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compact-world-full-universe-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_answer_cache.py tests/test_compact_world_build.py tests/test_accepted_price_stitch.py -q
  prepare:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      inputs_release: ${{ steps.plan.outputs.inputs_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - id: plan
        run: python -m ci.compact_world_build prepare --directory compact-world-plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-world-build-plan
          path: compact-world-plan/COMPACT*.json
          if-no-files-found: ignore
  build:
    needs: prepare
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 310
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.compact_world_build build --directory compact-world --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-world-shard-${{ matrix.index }}
          path: compact-world/COMPACT_WORLD_SHARD.json
          if-no-files-found: ignore
  measure:
    needs: [prepare,build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.compact_world_build merge --directory compact-world-measured --inputs-release '${{ needs.prepare.outputs.inputs_release }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-world-build-measured
          path: compact-world-measured/COMPACT_WORLD_BUILD_MEASURED.json
          if-no-files-found: ignore
