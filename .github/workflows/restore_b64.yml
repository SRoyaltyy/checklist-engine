name: restore_b64
# One-shot: restore integrity/splits_yahoo.parquet.b64 on kimi/step-a-engine-port
# from the canonical binary on orphan branch kimi/dictionary-fixes (base 1761ab64).
# Triggers on its own creation push; safe to delete after it runs green.
on:
  push:
    paths:
      - .github/workflows/restore_b64.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi/step-a-engine-port

      - name: Fetch canonical parquet from orphan branch and re-encode
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/SRoyaltyy/checklist-engine/contents/integrity/splits_yahoo.parquet?ref=kimi/dictionary-fixes" \
            -o /tmp/splits_yahoo.parquet
          base64 -w0 /tmp/splits_yahoo.parquet > integrity/splits_yahoo.parquet.b64
          test "$(wc -c < integrity/splits_yahoo.parquet.b64)" = "46020"

      - name: Verify checksum
        run: |
          echo "8f8dbf8f3be5439b2711dece122abfc1cd8e7678628e4147b36ffda299cb2f8a  integrity/splits_yahoo.parquet.b64" | sha256sum -c -

      - name: Commit restored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity/splits_yahoo.parquet.b64
          git commit -m "Restore integrity/splits_yahoo.parquet.b64 from orphan branch kimi/dictionary-fixes (base 1761ab64)"
          git push origin "HEAD:kimi/step-a-engine-port"
