name: price-full-cohort-pit
on:
  push:
    branches: [codex/price-full-cohort-pit]
    paths: ['ci/PRICE_FULL_COHORT_PIT_REQUEST.json']
  pull_request:
    paths: ['ci/price_full_cohort_pit.py', 'ci/PRICE_FULL_COHORT_PIT_REQUEST.json', 'tests/test_price_full_cohort_pit.py', '.github/workflows/price_full_cohort_pit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: price-full-cohort-pit-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m pytest tests/test_price_full_cohort_pit.py tests/test_completed_price_world_gate.py -q
      - id: request
        run: |
          python - <<'PY'
          import json, os
          request = json.load(open('ci/PRICE_FULL_COHORT_PIT_REQUEST.json'))
          assert type(request['execute']) is bool
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('execute=' + str(request['execute']).lower() + '\n')
          PY
  prepare:
    if: github.event_name != 'pull_request' && needs.verify.outputs.execute == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      inputs_release: ${{ steps.plan.outputs.inputs_release }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - id: plan
        run: python -m ci.price_full_cohort_pit prepare --directory pit-plan
  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_full_cohort_pit chunk --directory pit-smoke --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --plan-sha256 '${{ needs.prepare.outputs.plan_sha256 }}' --index smoke
  measure:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 285
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_full_cohort_pit chunk --directory pit-chunk --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --plan-sha256 '${{ needs.prepare.outputs.plan_sha256 }}' --index '${{ matrix.index }}'
  finalize:
    needs: [prepare, smoke, measure]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: python -m ci.price_full_cohort_pit finalize --directory pit-final --inputs-release '${{ needs.prepare.outputs.inputs_release }}' --plan-sha256 '${{ needs.prepare.outputs.plan_sha256 }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-full-cohort-pit-${{ github.run_id }}
          path: pit-final/PRICE_FULL_COHORT_PIT_MEASURED_V1.json
          if-no-files-found: ignore
