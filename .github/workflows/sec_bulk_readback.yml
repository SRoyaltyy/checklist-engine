name: sec-bulk-public-readback
on:
  push:
    branches: [gpt/sec-bulk-retained-v2]
    paths: ['ci/SEC_BULK_READBACK_REQUEST.json']
  pull_request:
    paths: ['ci/sec_bulk_readback*.py', 'ci/SEC_BULK_READBACK_REQUEST.json', 'tests/test_sec_bulk_readback*.py', '.github/workflows/sec_bulk_readback.yml']
permissions: {contents: read}
concurrency: {group: sec-bulk-public-readback, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pyarrow==26.0.0
      - run: python -m unittest discover -s tests -p 'test_sec_bulk_readback*.py' -v
      - id: request
        run: |
          python - <<'PY'
          import json,os
          from ci.sec_bulk_readback import validate_request
          request=validate_request(json.load(open('ci/SEC_BULK_READBACK_REQUEST.json')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('execute='+str(request['execute']).lower()+'\n')
          PY
  readback:
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: {contents: write, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install pyarrow==26.0.0
      - run: python -m ci.sec_bulk_readback --directory sec-bulk-readback-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-bulk-public-readback-${{ github.run_id }}
          path: sec-bulk-readback-output/SEC_BULK_PUBLIC_READBACK_V1.json
          if-no-files-found: ignore
