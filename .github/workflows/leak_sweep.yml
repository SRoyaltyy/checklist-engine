# Extended leak sweep (tests/leak_sweep.py): answers for day D must use no data from day D or later.
# Dispatch-only; heavy compute stays on the runner. Result JSON is kept as a run artifact and the
# summary is in the job log. 2020-24 input data only (answers still cut at engine END internally).
name: leak-sweep
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE: data-2020-24-v1
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi/step-a-wincompat
      - name: Python + system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential wget
          python3 -m pip install -q --upgrade pip
      - name: TA-Lib C library + Python wrapper
        run: |
          cd /tmp && wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz \
            && tar xzf ta-lib-0.4.0-src.tar.gz && cd ta-lib \
            && ./configure --prefix=/usr >/dev/null && sudo make -s install >/dev/null
          python3 -m pip install -q TA-Lib pandas numpy pyarrow
      - name: Download data release + verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ci/fetch_release.sh "$RELEASE" "$RUNNER_TEMP/data"
      - name: Run leak sweep (60 tickers x 12 cut dates)
        env:
          CHECKLIST_DATA_DIR: ${{ runner.temp }}/data
        run: |
          export GRID_FILE=/nonexistent
          python3 tests/leak_sweep.py --tickers 60 --out "$RUNNER_TEMP/leak_sweep.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leak-sweep-results
          path: ${{ runner.temp }}/leak_sweep.json
