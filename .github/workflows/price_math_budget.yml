name: native-price-math-v2-review
on:
  push:
    branches: [codex/native-price-math-v2]
    paths: ['facets_world.py', 'world_*.py', 'ci/price_math_budget.py', 'ci/NATIVE_PRICE_MATH_BUDGET_REQUEST.json', 'tests/test_world_moving_averages.py', '.github/workflows/price_math_budget.yml']
  pull_request:
    paths: ['facets_world.py', 'world_moving_averages.py', 'world_timeframes.py', 'world_indicator_settings.py', 'world_bar_statistics.py', 'world_food_statistics.py', 'ci/price_math_budget.py', 'tests/test_world_moving_averages.py', '.github/workflows/price_math_budget.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-price-math-v2-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_moving_averages.py tests/test_world_settings.py tests/test_world_bar_statistics.py tests/test_world_native_blocks.py tests/test_world_native_alignment.py -q
  budget:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - name: Measure old and corrected recipes on three verified released entities
        run: python -m ci.price_math_budget --directory price-math-budget
      - name: Preserve actual measurements even when a budget limit fails
        if: always()
        run: python -m ci.price_math_budget --directory price-math-budget --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-price-math-v2-measurements
          path: price-math-budget/*.json
          if-no-files-found: ignore
