name: binary_master_v1
on:
  pull_request:
    paths: ['world_binary_master.py', 'world_binary_price.py', 'world_binary_questions.py', 'ci/binary_master_build.py', 'ci/binary_master_storage.py', 'ci/ladder_semantic_review.py',
            'tests/test_binary_master.py', 'tests/test_binary_master_ratio_bands.py', 'tests/test_binary_master_storage.py', 'tests/test_binary_master_ladder_semantics.py', 'tests/test_binary_master_native_ma.py', 'tests/test_binary_master_williams_r.py', 'tests/test_binary_master_recursive_state.py', 'tests/test_binary_master_stochastic.py', 'tests/test_binary_master_native_atr.py', 'tests/test_binary_master_calendar.py', 'tests/test_binary_master_leak.py', 'tests/test_binary_master_partition.py', 'tests/test_binary_questions.py',
            'tests/test_binary_canonical_plan.py', 'dials/**', 'docs/BINARY_LADDERS_V1.csv',
            '.github/workflows/binary_master_v1.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: python -m pip install -r requirements-world-v2.txt numpy==2.5.4 pandas==2.3.3 pyarrow==26.0.0
      - run: git fetch --depth=1 origin 7dcaa48680daeac9a6025c09f9e4d138f5fcbda5 cae1923a45ec049ce9e9db97fe5c3e07943c99c3 6dcfced3263533afc13f518258d5eec24451db96
      - run: python -m pytest tests/test_binary_master.py tests/test_binary_master_ratio_bands.py tests/test_binary_master_storage.py tests/test_binary_master_ladder_semantics.py tests/test_binary_master_native_ma.py tests/test_binary_master_williams_r.py tests/test_binary_master_recursive_state.py tests/test_binary_master_stochastic.py tests/test_binary_master_native_atr.py tests/test_binary_master_calendar.py tests/test_binary_master_leak.py tests/test_binary_master_partition.py tests/test_binary_questions.py tests/test_binary_canonical_plan.py -q
      - name: Emit master and verify report consistency
        run: |
          python -m ci.binary_master_storage unpack
          python - <<'EOF' > /tmp/committed-master.sha
          import json
          import hashlib
          from pathlib import Path
          committed = json.loads(Path('docs/BINARY_MASTER_V1_REPORT.json').read_bytes())
          expected = committed['csv_sha256']
          assert hashlib.sha256(Path('docs/BINARY_MASTER_V1.csv').read_bytes()).hexdigest() == expected
          for name, checksum in committed['ladder_review_artifacts'].items():
              assert hashlib.sha256((Path('docs') / name).read_bytes()).hexdigest() == checksum
          Path('/tmp/committed-ladder-review.json').write_text(json.dumps(committed['ladder_review_artifacts']))
          print(expected)
          EOF
          python -m ci.binary_master_build > /tmp/report.json
          python - <<'EOF'
          import json
          import hashlib
          from pathlib import Path
          from ci.binary_master_storage import unpack_csv
          restored = unpack_csv(Path('docs'))
          r = json.load(open('/tmp/report.json'))
          assert r['csv_sha256'] == Path('/tmp/committed-master.sha').read_text().strip()
          assert hashlib.sha256(restored.read_bytes()).hexdigest() == r['csv_sha256']
          assert r['master_total_rows'] == r['bound_unique_binary_definitions'] + r['ladder_add_on_rows']
          assert r['ladder_source_rows'] == 2680
          assert r['ladder_alias_rows'] == 4
          assert r['ladder_add_on_rows'] + r['ladder_alias_rows'] == r['ladder_source_rows']
          assert r['ladder_review_artifacts'] == json.loads(Path('/tmp/committed-ladder-review.json').read_text())
          print('master rows:', r['master_total_rows'], 'unbound OAT:', r['unbound_oat_variants'])
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: binary-master-storage-${{ github.run_id }}
          path: |
            docs/BINARY_MASTER_V1.parts/
            docs/BINARY_MASTER_V1_STORAGE.json
            docs/BINARY_MASTER_V1_REPORT.json
            docs/BINARY_MASTER_LADDER_ALIASES_V1.csv
            docs/BINARY_MASTER_LADDER_REVIEW_V1.csv
