name: compact-world-storage-preflight
on:
  push:
    branches: [codex/compact-world-storage-budget]
    paths: ['world_answer_cache.py', 'ci/compact_world_storage_budget.py', 'ci/COMPACT_WORLD_STORAGE_REQUEST.json', 'tests/test_world_answer_cache.py', '.github/workflows/compact_world_storage.yml']
  pull_request:
    paths: ['world_answer_cache.py', 'ci/compact_world_storage_budget.py', 'ci/COMPACT_WORLD_STORAGE_REQUEST.json', 'tests/test_world_answer_cache.py', '.github/workflows/compact_world_storage.yml']
  workflow_dispatch:
    inputs:
      run_sample:
        type: boolean
        default: false
        description: Explicitly rerun the old storage sample; normal pushes only verify code
permissions:
  contents: read
concurrency:
  group: compact-world-storage-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m pytest tests/test_world_answer_cache.py -q
  sample:
    if: github.event_name == 'workflow_dispatch' && inputs.run_sample
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-world-v2.txt
      - run: python -m ci.compact_world_storage_budget --directory compact-storage-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-world-storage-preflight
          path: compact-storage-probe/*.json
          if-no-files-found: ignore
